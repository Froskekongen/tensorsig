name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / PyTorch ${{ matrix.torch-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: minimum
            dependency-group: dev
            torch-version: locked
          - python: "3.15"
            dependency-group: test
            torch-version: locked
          - python: minimum
            dependency-group: dev
            torch-version: "2.14.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Python
        env:
          PYTHON_REQUEST: ${{ matrix.python }}
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["requires-python"].removeprefix(">=")
          if os.environ["PYTHON_REQUEST"] != "minimum":
              version = os.environ["PYTHON_REQUEST"]
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"UV_PYTHON={version}\n")
          PYTHON

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: ${{ matrix.torch-version == 'locked' }}

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group ${{ matrix.dependency-group }}

      - name: Install minimum PyTorch
        if: matrix.torch-version != 'locked'
        run: uv pip install --python .venv/bin/python "torch==${{ matrix.torch-version }}"

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Test
        run: uv run --no-sync pytest -q
