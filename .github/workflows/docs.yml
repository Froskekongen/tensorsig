name: Docs

on:
  pull_request:
  release:
    types: [published]
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select minimum Python
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["requires-python"].removeprefix(">=")
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"UV_PYTHON={version}\n")
          PYTHON

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install docs dependencies only
        run: uv sync --locked --only-group docs --no-install-project

      - name: Build documentation
        run: uv run --no-sync python scripts/generate_docs.py

      - name: Setup Pages
        if: github.event_name == 'release'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: github.event_name == 'release'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
