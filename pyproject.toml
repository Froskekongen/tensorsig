[project]
name = "tensorsig"
version = "0.1.0"
description = "Differentiable tensor signatures, offset-coded signatures, and log-signatures for PyTorch."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Erlend Aune", email = "erlend.aune@pm.me" },
]
keywords = ["deep-learning", "pytorch", "signatures", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "torch>=2.14",
]

[project.urls]
Documentation = "https://froskekongen.github.io/tensorsig/"
Issues = "https://github.com/Froskekongen/tensorsig/issues"
Repository = "https://github.com/Froskekongen/tensorsig"
Releases = "https://github.com/Froskekongen/tensorsig/releases"

[dependency-groups]
docs = [
    "griffelib>=2.2.0",
    "jupytext>=1.17.3",
    "mkdocstrings[python]>=0.25.0",
    "zensical>=0.0.57",
]
test = [
    { include-group = "docs" },
    "numpy>=2.3",
    "pytest>=9.0.1",
    "ruff>=0.14.8",
]
dev = [
    { include-group = "test" },
    "esig>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = [
    "/src/tensorsig/experimental",
    "*.sqlite",
    "*.sqlite-*",
    ".DS_Store",
    "/src/**/*.md",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
