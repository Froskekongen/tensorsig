site_name: tensorsig
site_description: Differentiable tensor signatures and log-signatures in PyTorch
site_url: https://froskekongen.github.io/tensorsig/
docs_dir: generated-docs
site_dir: site

theme:
  variant: modern
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      toggle:
        icon: lucide/sun
        name: Switch to light mode

repo_url: https://github.com/Froskekongen/tensorsig
repo_name: Froskekongen/tensorsig

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_object_full_path: false
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

validation:
  links:
    not_found: warn
    anchors: warn
